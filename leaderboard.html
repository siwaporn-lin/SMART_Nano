<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อันดับ · SMART Nano</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div class="header"><h1>🏆 ตารางอันดับ</h1><p>สะสมคะแนนพิชิตดาวให้ได้มากที่สุด!</p></div>
<div class="container" id="area"><div class="spin"></div></div>

<script src="config.js?v=20"></script>
<script src="data.js?v=20"></script>
<script src="app.js?v=20"></script>
<script>
var SID='';
window.addEventListener('DOMContentLoaded', function(){
  SID=requireSid(); if(!SID) return;
  buildNav('rank');
  callAPI('getLeaderboard', null, render);
});
function render(lb){
  var el=document.getElementById('area');
  if (lb.error || !lb.length){ el.innerHTML='<div class="card center">ยังไม่มีข้อมูลอันดับ</div>'; return; }
  var medals={1:'🥇',2:'🥈',3:'🥉'};
  var html='<div class="card fade-in">';
  lb.forEach(function(s){
    var me=(String(s.student_id)===String(SID));
    html+='<div class="rank-row '+(me?'me':'')+'">'+
      '<div class="rank-num">'+(medals[s.rank]?'<span class="medal">'+medals[s.rank]+'</span>':s.rank)+'</div>'+
      '<div class="rank-name">'+esc(s.full_name||'นักเรียน')+(me?' <span class="pill green">ฉัน</span>':'')+'</div>'+
      '<div class="rank-pts">'+s.total_points+'</div>'+
    '</div>';
  });
  html+='</div>';
  el.innerHTML=html;
}
</script>
</body>
</html>
