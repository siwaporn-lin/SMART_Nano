<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>SMART Nano Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<!-- ===== เข้าสู่ระบบ ===== -->
<div id="loginView" style="display:none;">
  <div class="header"><h1>🎓 SMART Nano Learning</h1><p>วิชาการประกันภัย · By ครูรุ่ง AI</p></div>
  <div class="container">
    <div class="card center fade-in">
      <div style="font-size:3rem;">🌟</div>
      <h2 id="loginTitle">ยินดีต้อนรับ</h2>
      <p class="muted" id="loginHint">เข้าสู่ระบบเพื่อเริ่มภารกิจพิชิตดาว</p>
      <select id="studentSelect" style="display:none;"><option value="">-- กำลังโหลด --</option></select>
      <button class="btn green" id="lineLoginBtn" onclick="doLineLogin()" style="display:none;">🟢 เข้าสู่ระบบด้วย LINE</button>
      <button class="btn" id="loginBtn" onclick="doPickLogin()" style="display:none;">เข้าสู่ระบบ</button>
      <div id="loadMsg" class="muted" style="margin-top:8px;"></div>
    </div>
  </div>
</div>

<!-- ===== แดชบอร์ด ===== -->
<div id="profileView" style="display:none;">
  <div class="profile-top">
    <div class="profile-row">
      <div class="avatar" id="avatar">🙂</div>
      <div class="profile-info">
        <div class="pname" id="pName">-</div>
        <div class="plevel" id="pLevel">ระดับ: -</div>
      </div>
      <div class="ppoints"><div class="num" id="pPoints">0</div><div class="unit">คะแนน</div></div>
    </div>
    <div class="level-wrap">
      <div class="level-label"><span id="pLevelName">-</span><span id="pLevelProgress">0/0</span></div>
      <div class="level-bar"><div class="level-fill" id="pLevelFill" style="width:0%;"></div></div>
    </div>
    <div class="mini-stats">
      <div class="mini"><div class="mini-num" id="mTopics">–</div><div class="mini-label">เรื่องที่จบ</div></div>
      <div class="mini"><div class="mini-num" id="mBadge">–</div><div class="mini-label">เหรียญ</div></div>
      <div class="mini"><div class="mini-num" id="mRank">–</div><div class="mini-label">อันดับ</div></div>
    </div>
  </div>
  <div class="container fade-in" style="padding-top:14px;">
    <a class="btn pink" href="learn.html">📚 เริ่มเรียนรู้ (ภารกิจพิชิตดาว)</a>
    <a class="btn gray" href="badges.html">🎖️ เหรียญตราของฉัน</a>
    <a class="btn gray" href="leaderboard.html">🏆 ดูอันดับ</a>
    <button class="btn red" onclick="logout()">ออกจากระบบ</button>
  </div>
</div>

<script src="config.js?v=20"></script>
<script src="data.js?v=20"></script>
<script src="app.js?v=20"></script>
<script>
var lineProfile = null;
window.addEventListener('DOMContentLoaded', initAuth);

function initAuth(){
  var hasLiff = (typeof liff!=='undefined') && (typeof LIFF_ID!=='undefined') && LIFF_ID;
  if (!hasLiff){ fallbackNoLine(); return; }
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (liff.isLoggedIn()){
      liff.getProfile().then(function(p){ lineProfile=p; resolveLine(p); }).catch(fallbackNoLine);
    } else { liff.login(); }
  }).catch(fallbackNoLine);
}
function fallbackNoLine(){
  var sid=getSid();
  if (sid){ showProfile(sid); } else { showPickLogin(); }
}
function resolveLine(p){
  var nameB64=''; try{ nameB64=btoa(unescape(encodeURIComponent(p.displayName||''))); }catch(e){}
  callAPI('lineLogin', { line:p.userId, name:nameB64, picture:p.pictureUrl||'' }, function(r){
    if (r && r.student_id){ setSid(r.student_id); showProfile(r.student_id, p); }
    else { showPickLogin(); }
  });
}

// โหมดทดสอบ (ไม่มี LINE) — เลือกชื่อ
function showPickLogin(){
  document.getElementById('loginView').style.display='block';
  document.getElementById('profileView').style.display='none';
  document.getElementById('studentSelect').style.display='block';
  document.getElementById('loginBtn').style.display='flex';
  document.getElementById('loadMsg').textContent='กำลังเชื่อมต่อ...';
  callAPI('getStudents', null, function(list){
    var sel=document.getElementById('studentSelect'), msg=document.getElementById('loadMsg');
    if (list.error || !list.length){ sel.innerHTML='<option value="">ยังไม่มีรายชื่อ (เข้าด้วย LINE)</option>'; msg.textContent=''; return; }
    sel.innerHTML='<option value="">-- เลือกชื่อของคุณ --</option>';
    for (var i=0;i<list.length;i++){ var s=list[i]; sel.innerHTML+='<option value="'+esc(s.student_id)+'">'+esc(s.full_name)+'</option>'; }
    msg.textContent='พร้อมใช้งาน ('+list.length+' คน)';
  });
}
function doLineLogin(){ if (typeof liff!=='undefined' && liff.login) liff.login(); }
function doPickLogin(){
  var sid=document.getElementById('studentSelect').value;
  if (!sid){ alert('กรุณาเลือกชื่อของคุณ'); return; }
  setSid(sid); showProfile(sid);
}

// ===== แดชบอร์ด =====
function showProfile(sid, profile){
  // เปิดจากการ์ด LINE / QR: ?topic=1.1&type=video|ebook -> เช็คอิน+เด้งไปสื่อ
  var qp=new URLSearchParams(location.search);
  if (qp.get('topic') && qp.get('type')){
    location.href='go.html?topic='+encodeURIComponent(qp.get('topic'))+'&type='+encodeURIComponent(qp.get('type'));
    return;
  }
  if (qp.get('goto')==='checkin'){   // รองรับลิงก์/QR เดิม
    location.href='go.html?topic='+encodeURIComponent(qp.get('mission')||'')+'&type=checkin';
    return;
  }
  document.getElementById('loginView').style.display='none';
  document.getElementById('profileView').style.display='block';
  buildNav('home');
  if (profile && profile.pictureUrl) document.getElementById('avatar').innerHTML='<img src="'+profile.pictureUrl+'" alt="">';
  if (profile && profile.displayName) document.getElementById('pName').textContent=profile.displayName;

  callAPI('getProgress', { student:sid }, function(r){
    if (r.error){ logout(); return; }
    var name=(profile&&profile.displayName)?profile.displayName:(r.full_name||'นักเรียน');
    document.getElementById('pName').textContent=name;
    if (r.picture_url && !(profile&&profile.pictureUrl)) document.getElementById('avatar').innerHTML='<img src="'+r.picture_url+'" alt="">';
    else if (!(profile&&profile.pictureUrl) && !r.picture_url) document.getElementById('avatar').textContent=(name.trim().charAt(0)||'🙂');
    var pts=Number(r.total_points)||0;
    document.getElementById('pPoints').textContent=pts;
    var lv=levelInfo(pts);
    document.getElementById('pLevel').textContent='ระดับ: '+lv.name;
    document.getElementById('pLevelName').textContent=lv.name;
    document.getElementById('pLevelProgress').textContent=lv.text;
    document.getElementById('pLevelFill').style.width=lv.pct+'%';
    // เรื่องที่จบ (S+M+A)
    var done=0, tp=r.topics||{};
    for (var t in tp){ if (tp[t].S && tp[t].M && tp[t].A) done++; }
    document.getElementById('mTopics').textContent=done+'/'+D.topics.length;
    document.getElementById('mBadge').textContent=(r.badges?r.badges.length:0)+'/'+D.badges.length;
    document.getElementById('mRank').textContent=r.rank?('#'+r.rank):'–';
  });
}
</script>
</body>
</html>
