<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เหรียญตรา · SMART Nano</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div class="header"><h1>🎖️ เหรียญตราของฉัน</h1><p id="bCount">-</p></div>
<div class="container" id="area"><div class="spin"></div></div>

<script src="config.js?v=20"></script>
<script src="data.js?v=20"></script>
<script src="app.js?v=20"></script>
<script>
var SID='';
var GROUPS=[['สมรรถนะ','🧠 สมรรถนะสูง 4 ด้าน'],['หน่วย','🥇 ตราประจำหน่วย'],
            ['SMART','⭐ ดาว SMART'],['หมุดหมาย','🌟 หมุดหมาย']];
window.addEventListener('DOMContentLoaded', function(){
  SID=requireSid(); if(!SID) return;
  buildNav('badges');
  callAPI('getProgress', { student:SID }, function(r){
    var earned=(r&&r.badges)?r.badges:[];
    render(earned);
  });
});
function render(earned){
  var got={}; earned.forEach(function(id){ got[id]=1; });
  var el=document.getElementById('area'); el.innerHTML='';
  document.getElementById('bCount').textContent='ได้แล้ว '+earned.length+' / '+D.badges.length+' เหรียญ';
  GROUPS.forEach(function(g){
    var items=D.badges.filter(function(b){ return b.group===g[0]; });
    if (!items.length) return;
    var sec=document.createElement('div'); sec.className='fade-in';
    var grid='<div class="badge-grid">';
    items.forEach(function(b){
      var on=got[b.id]?'earned':'';
      grid+='<div class="badge '+on+'" title="'+esc(b.desc)+'"><div class="ic">'+b.icon+'</div>'+
        '<div class="bn">'+esc(b.name)+'</div></div>';
    });
    grid+='</div>';
    sec.innerHTML='<div class="section-title">'+g[1]+'</div>'+grid;
    el.appendChild(sec);
  });
  var tip=document.createElement('div'); tip.className='card muted fade-in'; tip.style.marginTop='16px';
  tip.innerHTML='แตะที่เหรียญเพื่อดูเงื่อนไข · เหรียญสีจางคือยังไม่ได้ 💪';
  el.appendChild(tip);
}
</script>
</body>
</html>
