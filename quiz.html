<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ · SMART Nano</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div class="header"><h1>✏️ แบบทดสอบ</h1><p id="qTitle">กำลังโหลด...</p></div>
<div class="container"><div id="area"><div class="spin"></div></div></div>

<script src="config.js?v=20"></script>
<script src="data.js?v=20"></script>
<script src="app.js?v=20"></script>
<script>
var SID='', TID='', QS=[], answers={};
window.addEventListener('DOMContentLoaded', function(){
  SID=requireSid(); if(!SID) return;
  TID=new URLSearchParams(location.search).get('topic')||'';
  var t=topicById(TID);
  document.getElementById('qTitle').textContent=t?(t.id+' '+t.name):TID;
  QS=quizOfTopic(TID);
  render();
});
function render(){
  var el=document.getElementById('area');
  if (!QS.length){ el.innerHTML='<div class="card center">ยังไม่มีข้อสอบ <a class="btn" href="topic.html?topic='+encodeURIComponent(TID)+'">กลับ</a></div>'; return; }
  var html='';
  QS.forEach(function(q){
    html+='<div class="card fade-in"><div class="q-text">'+q.no+'. '+esc(q.q)+'</div>';
    ['a','b','c','d'].forEach(function(c){
      html+='<label class="quiz-choice" id="q'+q.no+c+'" onclick="pick('+q.no+',\''+c+'\')">'+
        c.toUpperCase()+'. '+esc(q[c])+'</label>';
    });
    html+='</div>';
  });
  html+='<button class="btn green" onclick="submit()">📤 ส่งคำตอบ</button>';
  el.innerHTML=html;
}
function pick(no,c){
  answers[String(no)]=c;
  ['a','b','c','d'].forEach(function(x){ document.getElementById('q'+no+x).classList.remove('selected'); });
  document.getElementById('q'+no+c).classList.add('selected');
}
function submit(){
  if (Object.keys(answers).length<QS.length){ if(!confirm('ยังตอบไม่ครบทุกข้อ ส่งเลยไหม?')) return; }
  document.getElementById('area').innerHTML='<div class="spin"></div><p class="loading">กำลังตรวจ...</p>';
  callAPI('submitQuiz', { student:SID, topic:TID, answers:JSON.stringify(answers) }, showResult);
}
function showResult(r){
  var el=document.getElementById('area');
  if (r.error){ el.innerHTML='<div class="card center">'+esc(r.error)+'</div>'; return; }
  var html='<div class="card result-box fade-in"><div class="big">'+(r.passed?'🎉':'💪')+'</div>'+
    '<div class="score">'+r.score+'/'+r.total+'</div>'+
    '<p>'+r.percent+'% — '+(r.passed?'ผ่านแล้ว เก่งมาก!':'ยังไม่ผ่าน ลองใหม่นะ')+'</p>';
  if (r.earned) html+='<p style="color:#10B981;font-weight:600;">+'+r.earned+' คะแนน · ผ่านขั้น A ✅</p>';
  html+='<a class="btn" href="topic.html?topic='+encodeURIComponent(TID)+'">‹ กลับหน้าเรื่อง</a>';
  if (!r.passed) html+='<button class="btn amber" onclick="location.reload()">🔄 ทำใหม่</button>';
  html+='<a class="btn gray" href="learn.html">📚 เรื่องอื่น</a></div>';
  el.innerHTML=html;
}
</script>
</body>
</html>
